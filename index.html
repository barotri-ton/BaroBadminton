<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#071b2a"><title>BaroBadminton — Chơi cầu lông</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071b2a;color:#fff;font:15px system-ui,-apple-system,sans-serif;overflow:hidden}header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#0b2637}header strong{font-size:18px;color:#7ee6bf}button,select{font:inherit;border:0;border-radius:12px;padding:11px 14px}button{background:#18b889;color:#062c25;font-weight:750;touch-action:manipulation}select{background:#15394c;color:white;max-width:100%}#game{display:block;width:100vw;height:calc(100dvh - 188px);min-height:240px;touch-action:none}#score{text-align:center;font-weight:800;font-size:21px;letter-spacing:1px}#status{text-align:center;font-size:13px;color:#b7d7df;min-height:20px}#controls{z-index:4;position:absolute;bottom:0;width:100%;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:#0b2637;display:flex;align-items:center;justify-content:space-between;gap:10px}.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,42px);gap:4px}.pad button{padding:0;background:#24495b;color:white}.pad button[data-d=up]{grid-column:2}.pad button[data-d=left]{grid-column:1;grid-row:2}.pad button[data-d=down]{grid-column:2;grid-row:2}.pad button[data-d=right]{grid-column:3;grid-row:2}#hit{width:90px;height:78px;background:#ffcb58;font-size:15px}.shot-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:66vw}.shot-actions button{background:#284f62;color:#f5ffff;padding:10px 8px;font-size:12px;min-height:44px}.shot-actions button.selected{background:#ffcb58;color:#172d30}.pad button:active,#hit:active{transform:scale(.95);filter:brightness(1.15)}#overlay{overflow-y:auto;z-index:5;position:absolute;inset:56px 0 130px;display:grid;place-items:center;background:#071b2add;padding:20px}#panel{background:#123246;border:1px solid #326076;border-radius:22px;padding:22px;max-width:390px;width:100%;display:grid;gap:12px;box-shadow:0 20px 60px #0008}h1{margin:0;font-size:24px}small{color:#b6d1db}#panel label{display:grid;gap:5px}#panel input{width:100%}#hint{font-size:12px;color:#c1d8df;text-align:center}@media(max-width:390px){.pad{grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,38px)}#hit{height:60px;width:82px}.shot-actions{gap:3px}.shot-actions button{font-size:11px;padding:8px 6px;min-height:36px}#score{font-size:17px}header{height:50px}#game{height:calc(100dvh - 175px)}}@media(min-width:700px){#game{height:calc(100dvh - 175px)}#controls{justify-content:center;gap:80px}}</style></head>
<body><header><strong>🏸 BaroBadminton</strong><button id="menu">Cài đặt</button></header><div id="score">Bạn 0 — 0 Máy</div><div id="status">Chọn thiết bị và bắt đầu trận đấu</div><canvas id="game"></canvas><div id="controls"><div class="pad"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="down">▼</button><button data-d="right">▶</button></div><div class="shot-actions"><button id="clear" class="selected" data-shot="clear">Phông</button><button id="drop" data-shot="drop">Bỏ nhỏ</button><button id="smash" data-shot="smash">Đập</button><button id="hit">ĐÁNH CẦU</button></div></div>
<div id="overlay"><div id="panel"><h1>🏸 Vào sân thi đấu</h1><small>Chơi trực tiếp trên điện thoại • Đấu với máy • Chạm để di chuyển và đánh cầu</small><label>Vợt cầu lông<select id="racket"><option>Yonex Astrox 100 ZZ</option><option>Yonex Nanoflare 1000 Z</option><option>Victor Thruster Ryuga II</option><option>Li-Ning Axforce 90</option></select></label><label>Độ khó<select id="difficulty"><option value="easy">Dễ — Luyện tập</option><option value="normal" selected>Trung bình</option><option value="hard">Khó</option></select></label><label>Loại cầu<select id="shuttle"><option>Cầu lông vũ</option><option>Cầu nhựa</option></select></label><label>Độ căng dây: <span id="tensionLabel">11 kg</span><input id="tension" type="range" min="9" max="13" step=".5" value="11"></label><button id="start">Bắt đầu chơi</button><small>Thông số thiết bị là lựa chọn mô phỏng, chưa phải mô hình vật lý chính xác của nhà sản xuất.</small></div></div>
<script type="module">
import { newMatch, awardRally, scoreLabel } from './src/game/rules.mjs';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),score=document.getElementById('score'),status=document.getElementById('status');
let renderer3d=null;
let shotType='clear',rallyHits=0;
let w=0,h=0,playing=false,paused=false,player={x:.5,y:.83},bot={x:.5,y:.17},ball={x:.5,y:.5,z:.18,vx:.13,vy:.45,vz:.45},match=newMatch(),last=0,cooldown=0,keys=new Set(),pointer=null;
function resize(){const d=Math.min(devicePixelRatio||1,2);w=canvas.clientWidth;h=canvas.clientHeight;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const pos=(x,y)=>({x:w*(.14+.72*x),y:h*(.08+.84*y)});
function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#123a45';ctx.fillRect(0,0,w,h);const a=pos(0,0),b=pos(1,1);ctx.fillStyle='#16836f';ctx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.strokeStyle='#e6fff4';ctx.lineWidth=2;ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.beginPath();ctx.moveTo(w/2,a.y);ctx.lineTo(w/2,b.y);ctx.moveTo(a.x,h/2);ctx.lineTo(b.x,h/2);ctx.moveTo(a.x,h*.29);ctx.lineTo(b.x,h*.29);ctx.moveTo(a.x,h*.71);ctx.lineTo(b.x,h*.71);ctx.stroke();ctx.fillStyle='#d7f4ff';ctx.fillRect(a.x-6,h/2-3,b.x-a.x+12,6);ctx.fillStyle='#d9e6ed';ctx.fillRect(a.x-5,h/2-16,4,30);ctx.fillRect(b.x+1,h/2-16,4,30);
function person(p,color){let q=pos(p.x,p.y);ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(q.x,q.y+12,15,6,0,0,7);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.arc(q.x,q.y-7,13,0,7);ctx.fill();ctx.fillStyle='#ffe0bd';ctx.beginPath();ctx.arc(q.x,q.y-22,7,0,7);ctx.fill();ctx.strokeStyle='#e7edf0';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(q.x+10,q.y-9);ctx.lineTo(q.x+23,q.y-25);ctx.stroke();ctx.beginPath();ctx.ellipse(q.x+27,q.y-30,9,14,-.6,0,7);ctx.stroke()}
person(bot,'#f66c79');person(player,'#5ab9ff');const q=pos(ball.x,ball.y);ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(q.x,q.y+5,7,3,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(q.x,q.y-30-ball.z*45,7,11,.4,0,7);ctx.fill();ctx.fillStyle='#ffcb58';ctx.beginPath();ctx.arc(q.x-2,q.y-22-ball.z*45,3,0,7);ctx.fill()}
function reset(towardPlayer=true){ball={x:.5,y:towardPlayer?.45:.55,z:.3,vx:(Math.random()-.5)*.12,vy:towardPlayer?.25:-.25,vz:.8};cooldown=.45;rallyHits=0}
function point(side){
  if(!playing||paused)return;
  const previousGames=[...match.games];
  match=awardRally(match,side);
  score.textContent=scoreLabel(match);
  if(match.winner!==null){
    playing=false;
    status.textContent=match.winner===0?'Bạn đã chiến thắng trận đấu!':'Máy đã chiến thắng trận đấu!';
    overlay.style.display='grid';
    document.getElementById('start').textContent='Đấu lại';
    return;
  }
  if(match.games[0]!==previousGames[0]||match.games[1]!==previousGames[1]){
    status.textContent=side===0?'Bạn thắng hiệp!':'Máy thắng hiệp!';
  } else status.textContent=side===0?'Bạn ghi điểm!':'Máy ghi điểm!';
  reset(side===1);
}
function swing(){
  if(!playing||paused||cooldown>0)return;
  const dx=Math.abs(player.x-ball.x),dy=Math.abs(player.y-ball.y);
  if(ball.vy>0&&ball.y>.48&&ball.y<.96&&dx<.23&&dy<.24){
    const tension=Number(document.getElementById('tension').value);
    const shots={clear:{speed:.39,height:1.1,name:'Phông cầu'},drop:{speed:.21,height:.46,name:'Bỏ nhỏ'},smash:{speed:.65,height:.32,name:'Đập cầu'}};
    const shot=shots[shotType];
    ball.vy=-shot.speed*(1+(tension-11)*.012);
    ball.vx=clamp((.5-ball.x)*.22+(Math.random()-.5)*.09,-.22,.22);
    ball.vz=shot.height;
    cooldown=.24;
    rallyHits++;
    status.textContent=shot.name+' thành công!';
  }else{cooldown=.15;status.textContent='Di chuyển đến gần cầu để đánh trả!'}
}
function update(dt){
  if(!playing||paused)return;
  cooldown=Math.max(0,cooldown-dt);
  let mx=Number(keys.has('right'))-Number(keys.has('left'));
  let my=Number(keys.has('down'))-Number(keys.has('up'));
  if(pointer){mx+=pointer.x-player.x;my+=pointer.y-player.y}
  const magnitude=Math.hypot(mx,my);
  if(magnitude>1){mx/=magnitude;my/=magnitude}
  player.x=clamp(player.x+mx*dt*.88,.05,.95);
  player.y=clamp(player.y+my*dt*.88,.54,.96);
  const difficulty=document.getElementById('difficulty').value;
  const aiSpeed={easy:.23,normal:.39,hard:.57}[difficulty];
  const aiReach={easy:.13,normal:.17,hard:.20}[difficulty];
  const targetX=ball.vy<0?ball.x:.5;
  const targetY=ball.vy<0?clamp(ball.y-.06,.07,.42):.20;
  bot.x+=clamp(targetX-bot.x,-dt*aiSpeed,dt*aiSpeed);
  bot.y=clamp(bot.y+clamp(targetY-bot.y,-dt*aiSpeed,dt*aiSpeed),.06,.43);
  const previousY=ball.y;
  ball.x+=ball.vx*dt;
  ball.y+=ball.vy*dt;
  ball.z=Math.max(0,ball.z-dt*.42);
  if((previousY-.5)*(ball.y-.5)<=0&&ball.z<.12){status.textContent='Cầu chạm lưới!';point(ball.vy>0?0:1);return}
  if(ball.y<.45&&ball.vy<0&&Math.abs(ball.x-bot.x)<aiReach&&Math.abs(ball.y-bot.y)<aiReach){
    ball.vy=.29+(difficulty==='hard'?.12:0);
    ball.vx=clamp((player.x-ball.x)*.25+(Math.random()-.5)*.18,-.25,.25);
    ball.vz=.85;
    rallyHits++;
    status.textContent='Máy trả cầu!';
  }
  if(ball.x<0||ball.x>1){status.textContent='Cầu ngoài sân!';point(ball.vy>0?0:1)}
  else if(ball.y>.99){point(1)}
  else if(ball.y<.01){point(0)}
}
function frame(t){let dt=Math.min((t-last)/1000||0,.04);last=t;update(dt);if(renderer3d){renderer3d.render({player,bot,ball});}else{draw();}requestAnimationFrame(frame)}requestAnimationFrame(frame);
document.querySelectorAll('[data-d]').forEach(b=>{let dir=b.dataset.d;b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(dir);b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>keys.delete(dir)))});document.querySelectorAll('[data-shot]').forEach(button=>button.addEventListener('pointerdown',event=>{event.preventDefault();shotType=button.dataset.shot;document.querySelectorAll('[data-shot]').forEach(b=>b.classList.toggle('selected',b===button))}));document.getElementById('hit').addEventListener('pointerdown',e=>{e.preventDefault();swing()});canvas.addEventListener('pointerdown',e=>{let r=canvas.getBoundingClientRect();pointer={x:clamp((e.clientX-r.left)/w-.14,0,.72)/.72,y:clamp(((e.clientY-r.top)/h-.08)/.84,.56,.96)};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(pointer){let r=canvas.getBoundingClientRect();pointer={x:clamp(((e.clientX-r.left)/w-.14)/.72,0,1),y:clamp(((e.clientY-r.top)/h-.08)/.84,.56,.96)}}});['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,()=>pointer=null));document.addEventListener('keydown',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(m[e.key]){keys.add(m[e.key]);e.preventDefault()}if(e.code==='Space'){swing();e.preventDefault()}});document.addEventListener('keyup',e=>{const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};keys.delete(m[e.key])});document.getElementById('tension').addEventListener('input',e=>document.getElementById('tensionLabel').textContent=e.target.value+' kg');document.getElementById('start').onclick=()=>{if(playing&&paused&&match.winner===null){paused=false;overlay.style.display='none';status.textContent='Tiếp tục trận đấu';return;}paused=false;keys.clear();pointer=null;match=newMatch();score.textContent=scoreLabel(match);player={x:.5,y:.83};bot={x:.5,y:.17};reset();playing=true;overlay.style.display='none';status.textContent='Di chuyển và đánh cầu khi cầu đến gần!'};document.getElementById('menu').onclick=()=>{paused=true;keys.clear();pointer=null;overlay.style.display='grid';document.getElementById('start').textContent='Tiếp tục trận đấu'};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){paused=true;keys.clear();pointer=null;overlay.style.display='grid';document.getElementById('start').textContent='Tiếp tục trận đấu';status.textContent='Trận đấu đã tạm dừng'}});
window.addEventListener('blur',()=>{keys.clear();pointer=null});
import('./render3d.js').then(({create3DRenderer})=>{try{renderer3d=create3DRenderer(canvas);status.textContent=playing?'Sân cầu lông 3D đã sẵn sàng':'Sân 3D đã sẵn sàng — Bắt đầu trận đấu';}catch(error){console.warn('Không thể khởi tạo 3D, sử dụng chế độ 2D.',error)}}).catch(error=>console.warn('Không thể tải 3D, sử dụng chế độ 2D.',error));
</script></body></html>
